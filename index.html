<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost Sideloadly</title>
<style>
  :root {
    --acento: #3b82f6;
    --acento-rgb: 59, 130, 246;
    --fondo: #081120;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }

  body {
    background-color: var(--fondo);
    background-image:
      radial-gradient(circle, rgba(var(--acento-rgb),.10) 1.5px, transparent 1.5px),
      radial-gradient(circle, transparent 8px, rgba(var(--acento-rgb),.07) 8px, rgba(var(--acento-rgb),.07) 9.5px, transparent 9.5px);
    background-size: 48px 48px, 96px 96px;
    min-height: 100vh;
    color: #fff;
    transition: background-color .4s;
    position: relative;
    overflow-x: hidden;
  }

  /* ── TEXTURA DE FONDO ── */
  #bg-texture {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    user-select: none;
    font-weight: 900;
    word-break: break-all;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    padding: 12px;
    gap: 0;
    transition: color .4s;
  }

  header, .titulo-seccion, .logo-gigante, .switches, .lista-apps {
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    background: #000;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
  }
  .red-social {
    width:34px; height:34px; border-radius:50%;
    background:#1a1a1a; border:1px solid #333;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; transition:transform .2s;
  }
  .red-social:hover { transform:scale(1.15); }
  .red-social img { width:20px; height:20px; border-radius:50%; }
  header h1 { font-size:17px; font-weight:700; margin-left:6px; }

  /* ── TÍTULO Y LOGO GRANDE ── */
  .titulo-seccion {
    text-align:center; color:var(--acento);
    font-size:30px; font-weight:800;
    margin:28px 0 14px; transition:color .4s;
  }

  .logo-gigante {
    width:140px; height:140px;
    margin:0 auto 22px;
    border-radius:50%; overflow:hidden;
    box-shadow:0 0 30px 6px rgba(var(--acento-rgb),.55);
    border:3px solid rgba(var(--acento-rgb),.6);
    background:linear-gradient(135deg,var(--acento),#1e293b);
    display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:#fff;
    transition:box-shadow .4s, border-color .4s;
  }
  .logo-gigante img {
    width:100%; height:100%;
    object-fit:cover; border-radius:50%;
    display:block;
  }

  /* ── SWITCHES ── */
  .switches {
    display:flex; justify-content:center;
    flex-wrap:wrap; gap:12px;
    margin-bottom:45px; padding:0 15px;
  }
  .switch-btn {
    padding:8px 22px; border-radius:999px;
    border:1px solid rgba(var(--acento-rgb),.45);
    background:rgba(10,18,32,.9);
    color:#cbd5e1; font-weight:700; font-size:14px;
    cursor:pointer; transition:all .2s;
  }
  .switch-btn:hover { border-color:var(--acento); color:#fff; }
  .switch-btn.activo {
    background:var(--acento); color:#0a0f1a;
    border-color:var(--acento);
    box-shadow:0 0 16px rgba(var(--acento-rgb),.6);
  }

  /* ── LISTA DE APPS ── */
  .lista-apps {
    max-width:950px; margin:0 auto;
    padding:0 18px 60px;
    display:flex; flex-direction:column; gap:38px;
  }

  /* ── TARJETA ── */
  .app-card {
    position:relative;
    background:#0c1424;
    border:1px solid rgba(var(--acento-rgb),.35);
    border-radius:16px;
    box-shadow:0 0 18px rgba(var(--acento-rgb),.18);
    display:flex; align-items:center; gap:18px;
    padding:22px 24px;
    transition:border-color .4s, box-shadow .4s;
  }
  .app-card .etiqueta-nombre {
    position:absolute; top:-16px; left:18px;
    background:#fff; color:#0a0a0a;
    font-weight:800; font-size:14px;
    padding:5px 14px; border-radius:8px 8px 0 0;
    box-shadow:0 -2px 8px rgba(0,0,0,.25);
  }

  /* ── ÍCONO APP — totalmente circular sin bordes blancos ── */
  .app-icono {
    width:62px; height:62px; min-width:62px;
    border-radius:50%; overflow:hidden;
    background:var(--acento);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px; color:#fff;
    border:2.5px solid rgba(var(--acento-rgb),.6);
    box-shadow:0 0 10px rgba(var(--acento-rgb),.3);
    flex-shrink:0;
  }
  .app-icono img {
    width:100%; height:100%;
    object-fit:cover; border-radius:50%;
    display:block; background:var(--acento);
  }

  /* ── INFO ── */
  .app-info { flex:1; min-width:0; }
  .app-info .subtitulo {
    color:#e2e8f0; font-size:13px; font-weight:600;
    margin-bottom:5px; word-break:break-word;
  }
  .app-info .estado {
    color:#94a3b8; font-size:12.5px;
    display:flex; align-items:center; gap:6px;
  }
  .orb {
    display:inline-block; width:8px; height:8px;
    min-width:8px; border-radius:50%; flex-shrink:0;
  }

  /* ── BOTÓN INSTALAR ── */
  .btn-instalar {
    background:var(--acento); color:#0a0f1a;
    font-weight:800; font-size:14px;
    padding:10px 26px; border-radius:999px;
    text-decoration:none; transition:all .2s;
    white-space:nowrap;
  }
  .btn-instalar:hover {
    filter:brightness(1.2);
    box-shadow:0 0 14px rgba(var(--acento-rgb),.7);
  }

  /* ── BOTÓN CHECK IPA LIBRARY ── */
  .btn-ipa-library {
    display:flex; align-items:center; justify-content:center;
    gap:10px; width:100%;
    padding:16px 28px;
    background:rgba(var(--acento-rgb),.08);
    border:1.5px solid rgba(var(--acento-rgb),.4);
    border-radius:14px;
    color:var(--acento); font-weight:800; font-size:15px;
    text-decoration:none;
    letter-spacing:.04em;
    transition:all .25s;
    margin-top:8px;
  }
  .btn-ipa-library:hover {
    background:rgba(var(--acento-rgb),.18);
    border-color:var(--acento);
    box-shadow:0 0 20px rgba(var(--acento-rgb),.35);
    transform:translateY(-2px);
  }
  .ipa-arrow {
    font-size:20px; transition:transform .2s;
  }
  .btn-ipa-library:hover .ipa-arrow { transform:translateX(5px); }

  @media (max-width:600px) {
    .app-card { flex-wrap:wrap; }
    .btn-instalar { width:100%; text-align:center; }
  }
  /* ── ANIMACIÓN NUEVA FILA ── */
  @keyframes cardIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
  .card-new{animation:cardIn .35s ease;}
</style>

  spam:     {texto:"Spam",     color:"#ef4444"},
  updating: {texto:"Updating", color:"#fbbf24"},
};

const TEXTURAS = {
  "Ksign":         {char:"Ksign",  size:88},
  "ESign":         {char:"Esign", size:72},
  "Feather":       {char:"✦", size:72},
  "Scarlet":       {char:"Scarlet",  size:88},
  "NexStore":      {char:"NexStore",  size:88},
  "SideInstaller": {char:"⇅", size:72},
};

let seccionActiva = 0;

function hexARgb(hex){
  const h=hex.replace("#","");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function iniciales(n){ return n.split(" ").map(p=>p[0]).join("").slice(0,2).toUpperCase(); }

function aplicarColor(sec){
  const [r,g,b]=hexARgb(sec.color||"#3b82f6");
  const root=document.documentElement.style;
  root.setProperty("--acento", sec.color||"#3b82f6");
  root.setProperty("--acento-rgb",`${r}, ${g}, ${b}`);
  root.setProperty("--fondo", sec.fondoNegro ? "#080808" : `rgb(${Math.round(8+r*.09)},${Math.round(17+g*.09)},${Math.round(32+b*.09)})`);
}

function actualizarTextura(sec){
  const t=TEXTURAS[sec.nombre]||{char:iniciales(sec.nombre),size:80};
  const [r,g,b]=hexARgb(sec.color||"#3b82f6");
  const el=document.getElementById("bg-texture");
  if(!el)return;
  el.style.fontSize=t.size+"px";
  el.style.color=`rgba(${r},${g},${b},0.07)`;
  const cols=Math.ceil(window.innerWidth/(t.size*1.5))+2;
  const rows=Math.ceil(window.innerHeight/(t.size*1.5))+4;
  el.textContent=(t.char+" ").repeat(cols*rows*3);
}

function renderHeader(){
  const h=document.getElementById("barra-superior");
  h.innerHTML="";
  CONFIG.redesSociales.forEach(r=>{
    const a=document.createElement("a");
    a.className="red-social"; a.href=r.url; a.target="_blank"; a.title=r.nombre;
    a.innerHTML=`<img src="${r.icono}" alt="${r.nombre}">`;
    h.appendChild(a);
  });
  const h1=document.createElement("h1");
  h1.textContent=CONFIG.tituloSitio;
  h.appendChild(h1);
  document.title=CONFIG.tituloSitio;
}

function renderSwitches(){
  const c=document.getElementById("switches");
  c.innerHTML="";
  CONFIG.secciones.forEach((sec,i)=>{
    const b=document.createElement("button");
    b.className="switch-btn"+(i===seccionActiva?" activo":"");
    b.textContent=sec.nombre;
    b.onclick=()=>{seccionActiva=i;renderSeccion();renderSwitches();window.scrollTo({top:0,behavior:"smooth"});};
    c.appendChild(b);
  });
}

function renderSeccion(){
  const sec=CONFIG.secciones[seccionActiva];
  aplicarColor(sec);
  actualizarTextura(sec);
  document.getElementById("titulo-seccion").textContent=sec.nombre;

  const logoURL=sec.logoApps||"";
  const logoDiv=document.getElementById("logo-gigante");
  logoDiv.innerHTML=logoURL
    ?`<img src="${logoURL}" alt="logo" onerror="this.parentNode.innerHTML='${iniciales(sec.nombre)}';">`
    :iniciales(sec.nombre);

  const lista=document.getElementById("lista-apps");
  lista.innerHTML="";

  sec.apps.forEach(app=>{
    const logoApp=sec.logoApps||"";
    const est=ESTADOS[app.estado||"activo"]||ESTADOS.activo;
    const card=document.createElement("div");
    card.className="app-card";
    card.innerHTML=`
      <span class="etiqueta-nombre">${app.nombre}</span>
      <div class="app-icono">
        ${logoApp?`<img src="${logoApp}" alt="${app.nombre}" onerror="this.parentNode.innerHTML='${iniciales(app.nombre)}'">`:iniciales(app.nombre)}
      </div>
      <div class="app-info">
        <div class="subtitulo">${app.subtitulo||""}</div>
        <div class="estado">
          <span class="orb" style="background:${est.color};box-shadow:0 0 6px ${est.color};"></span>
          ${est.texto}
        </div>
      </div>
      <a class="btn-instalar" href="${app.descarga||"#"}" target="_blank">Install</a>
    `;
    lista.appendChild(card);
  });

  const btnIPA=document.createElement("a");
  btnIPA.className="btn-ipa-library";
  btnIPA.href="https://gist.github.com/grave0x/0f5bac981c49f4cf2e4b781164432e6f";
  btnIPA.target="_blank";
  btnIPA.innerHTML=`Check the IPA Library <span class="ipa-arrow">→</span>`;
  lista.appendChild(btnIPA);
}

renderHeader();
renderSwitches();
renderSeccion();
window.addEventListener("resize",()=>actualizarTextura(CONFIG.secciones[seccionActiva]));
</script>

<script src="https://gist.github.com/grave0x/0f5bac981c49f4cf2e4b781164432e6f.js"></script>
</body>
</html>
