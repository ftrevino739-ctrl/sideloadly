<title>Frost sideloadly</title>
<style>
  :root {
    --acento: #3b82f6;
    --acento-rgb: 59, 130, 246;
    --fondo: #081120;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    background-color: var(--fondo);
    background-image:
      radial-gradient(circle, rgba(var(--acento-rgb), 0.10) 1.5px, transparent 1.5px),
      radial-gradient(circle, transparent 8px, rgba(var(--acento-rgb), 0.07) 8px, rgba(var(--acento-rgb), 0.07) 9.5px, transparent 9.5px);
    background-size: 48px 48px, 96px 96px;
    min-height: 100vh;
    color: #fff;
    transition: background-color .4s;
  }

  header {
    background: #000;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
  }
  header .red-social {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: transform .2s;
  }
  header .red-social:hover { transform: scale(1.15); }
  header .red-social img { width: 20px; height: 20px; border-radius: 50%; }
  header h1 { font-size: 17px; font-weight: 700; margin-left: 6px; }

  .titulo-seccion {
    text-align: center;
    color: var(--acento);
    font-size: 30px;
    font-weight: 800;
    margin: 28px 0 14px;
    transition: color .4s;
  }

  .logo-gigante {
    width: 140px; height: 140px;
    margin: 0 auto 22px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 30px 6px rgba(var(--acento-rgb), 0.55);
    border: 3px solid rgba(var(--acento-rgb), 0.6);
    background: linear-gradient(135deg, var(--acento), #1e293b);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800; color: #fff;
    transition: box-shadow .4s, border-color .4s;
  }
  .logo-gigante img { width: 100%; height: 100%; object-fit: cover; }

  .switches {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 45px;
    padding: 0 15px;
  }
  .switch-btn {
    padding: 8px 22px;
    border-radius: 999px;
    border: 1px solid rgba(var(--acento-rgb), 0.45);
    background: rgba(10, 18, 32, 0.9);
    color: #cbd5e1;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .switch-btn:hover { border-color: var(--acento); color: #fff; }
  .switch-btn.activo {
    background: var(--acento);
    color: #0a0f1a;
    border-color: var(--acento);
    box-shadow: 0 0 16px rgba(var(--acento-rgb), 0.6);
  }

  .lista-apps {
    max-width: 950px;
    margin: 0 auto;
    padding: 0 18px 60px;
    display: flex;
    flex-direction: column;
    gap: 38px;
  }

  .app-card {
    position: relative;
    background: #0c1424;
    border: 1px solid rgba(var(--acento-rgb), 0.35);
    border-radius: 16px;
    box-shadow: 0 0 18px rgba(var(--acento-rgb), 0.18);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 24px;
    transition: border-color .4s, box-shadow .4s;
  }

  .app-card .etiqueta-nombre {
    position: absolute;
    top: -16px; left: 18px;
    background: #fff;
    color: #0a0a0a;
    font-weight: 800;
    font-size: 14px;
    padding: 5px 14px;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.25);
  }

  .app-icono {
    width: 62px; height: 62px;
    min-width: 62px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, var(--acento), #1e293b);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: #fff;
    border: 2px solid rgba(var(--acento-rgb), 0.5);
  }
  .app-icono img { width: 100%; height: 100%; object-fit: cover; }

  .app-info { flex: 1; min-width: 0; }
  .app-info .subtitulo {
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    word-break: break-word;
  }
  .app-info .estado {
    color: #94a3b8;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .orb {
    display: inline-block;
    width: 8px; height: 8px;
    min-width: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .btn-instalar {
    background: var(--acento);
    color: #0a0f1a;
    font-weight: 800;
    font-size: 14px;
    padding: 10px 26px;
    border-radius: 999px;
    text-decoration: none;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-instalar:hover { filter: brightness(1.2); box-shadow: 0 0 14px rgba(var(--acento-rgb), 0.7); }

  @media (max-width: 600px) {
    .app-card { flex-wrap: wrap; }
    .btn-instalar { width: 100%; text-align: center; }
  }
</style>

let seccionActiva = 0;

function hexARgb(hex) {
  const h = hex.replace("#", "");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function iniciales(nombre) {
  return nombre.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

function aplicarColor(sec) {
  const [r,g,b] = hexARgb(sec.color || "#3b82f6");
  const base = [8,17,32];
  const fondo = base.map((c,i) => Math.round(c + ([r,g,b][i]-c)*0.09));
  const root = document.documentElement.style;
  root.setProperty("--acento",     sec.color||"#3b82f6");
  root.setProperty("--acento-rgb", `${r}, ${g}, ${b}`);
  root.setProperty("--fondo",      `rgb(${fondo[0]},${fondo[1]},${fondo[2]})`);
}

function renderHeader() {
  const h = document.getElementById("barra-superior");
  h.innerHTML = "";
  CONFIG.redesSociales.forEach(r => {
    const a = document.createElement("a");
    a.className = "red-social";
    a.href = r.url; a.target = "_blank"; a.title = r.nombre;
    a.innerHTML = `<img src="${r.icono}" alt="${r.nombre}">`;
    h.appendChild(a);
  });
  const h1 = document.createElement("h1");
  h1.textContent = CONFIG.tituloSitio;
  h.appendChild(h1);
  document.title = CONFIG.tituloSitio;
}

function renderSwitches() {
  const c = document.getElementById("switches");
  c.innerHTML = "";
  CONFIG.secciones.forEach((sec, i) => {
    const b = document.createElement("button");
    b.className = "switch-btn" + (i === seccionActiva ? " activo" : "");
    b.textContent = sec.nombre;
    b.onclick = () => { seccionActiva = i; renderSeccion(); renderSwitches(); window.scrollTo({top:0,behavior:"smooth"}); };
    c.appendChild(b);
  });
}

function renderSeccion() {
  const sec = CONFIG.secciones[seccionActiva];
  aplicarColor(sec);

  document.getElementById("titulo-seccion").textContent = sec.nombre;

  const logoURL = sec.logoGigante || CONFIG.logoGigante || sec.logoApps || "";
  const logoDiv = document.getElementById("logo-gigante");
  logoDiv.innerHTML = logoURL ? `<img src="${logoURL}" alt="logo" onerror="this.style.display='none';this.parentNode.innerHTML='${iniciales(sec.nombre)}'">` : iniciales(sec.nombre);

  const lista = document.getElementById("lista-apps");
  lista.innerHTML = "";

  sec.apps.forEach(app => {
    const logoApp = app.logo || sec.logoApps || "";
    const est = ESTADOS[app.estado || "activo"] || ESTADOS.activo;

    const card = document.createElement("div");
    card.className = "app-card";
    card.innerHTML = `
      <span class="etiqueta-nombre">${app.nombre}</span>
      <div class="app-icono">
        ${logoApp
          ? `<img src="${logoApp}" alt="${app.nombre}" onerror="this.style.display='none'">`
          : iniciales(app.nombre)}
      </div>
      <div class="app-info">
        <div class="subtitulo">${app.subtitulo || ""}</div>
        <div class="estado">
          <span class="orb" style="background:${est.color}; box-shadow:0 0 6px ${est.color};"></span>
          ${est.texto}
        </div>
      </div>
      <a class="btn-instalar" href="${app.descarga}" target="_blank">Install</a>
    `;
    lista.appendChild(card);
  });
}

renderHeader();
renderSwitches();
renderSeccion();
</script>
</body>
</html>
